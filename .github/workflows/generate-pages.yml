name: Auto-Generate Newsletter Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/covers/**"
      - "2025/**"
      - "2026/**"
      - "2027/**"
      - "scripts/**"
  schedule:
    - cron: "0 3 * * *"   # 매일 03:00 UTC(카이로 05:00~06:00) — GoatCounter 통계 자동 갱신용
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Run generator
        run: python scripts/generate.py

      - name: Commit & Push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html viewer/
          git diff --cached --quiet || git commit -m "chore: auto-generate pages [skip ci]"
          git push
